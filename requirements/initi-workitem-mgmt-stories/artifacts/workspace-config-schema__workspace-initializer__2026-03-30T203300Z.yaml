# workspace-config.yml Schema Definition
# Generated by workspace-initializer role
# Story: STORY-007

# This file defines the structure of workspace-config.yml
# that lives at <workspace-root>/workspace-config.yml

# Example workspace-config.yml file:
---
# Workspace Schema Version
version: "1.0"

# Workspace metadata
metadata:
  created_at: "2026-03-30T10:00:00Z"
  created_by: "orchestrator"
  workspace_name: "my-ai-project"
  description: "AI-managed work items for project X"

# Workspace paths (all relative to workspace root)
paths:
  workspace_root: "/absolute/path/to/workspace"  # Absolute path
  work_items: "work-items"
  reference: "reference"
  agents: "agents"
  templates: "templates"

# Lifecycle configuration
lifecycle:
  # Prioritization states (orthogonal to workflow)
  prioritization_states:
    - name: "backlog"
      directory: "work-items/backlog"
      description: "Captured but not yet prioritized"
    - name: "prioritized"
      directory: null  # Prioritized items live in workflow dirs
      description: "Prioritized and ready for workflow"

  # Workflow states
  workflow_states:
    - name: "todo"
      directory: "work-items/todo"
      description: "Ready for execution"
      allowed_transitions:
        agent: ["in-progress"]
        human: ["in-progress", "done"]
    - name: "in-progress"
      directory: "work-items/in-progress"
      description: "Actively being worked"
      allowed_transitions:
        agent: ["awaiting-approval"]
        human: ["todo", "awaiting-approval", "done"]
    - name: "awaiting-approval"
      directory: "work-items/awaiting-approval"
      description: "Completed, pending approval"
      allowed_transitions:
        agent: []
        human: ["in-progress", "done"]
    - name: "done"
      directory: "work-items/done"
      description: "Completed and approved"
      allowed_transitions:
        agent: []
        human: ["in-progress"]

# Roles configuration
roles:
  - name: "orchestrator"
    can_modify_story: true
    can_transition_states: true
    description: "Workflow coordinator"
  - name: "designer"
    can_modify_story: false
    can_transition_states: false
    description: "UX/UI design"
  - name: "logician"
    can_modify_story: false
    can_transition_states: false
    description: "Algorithms and logic"
  - name: "coder"
    can_modify_story: false
    can_transition_states: false
    description: "Code implementation"
  - name: "creative-writer"
    can_modify_story: false
    can_transition_states: false
    description: "Creative content"
  - name: "artist"
    can_modify_story: false
    can_transition_states: false
    description: "Image generation"
  - name: "tester"
    can_modify_story: false
    can_transition_states: false
    description: "Testing and QA"
  - name: "reviewer"
    can_modify_story: false
    can_transition_states: false
    description: "Code and design review"
  - name: "researcher"
    can_modify_story: false
    can_transition_states: false
    description: "Research and analysis"
  - name: "documenter"
    can_modify_story: false
    can_transition_states: false
    description: "Technical documentation"

# Naming conventions
naming:
  story_directory: "STORY-{id}-{slug}"
  task_directory: "TASK-{id}-{slug}"
  artifact_file: "{descriptive-name}__{role}__{timestamp}.{ext}"
  comment_file: "comment__{role}__{timestamp}.md"
  log_file: "agents/logs/{role}__{yyyy-mm-dd}.log"

# Validation rules
validation:
  max_story_id: 99999
  max_task_id: 9999
  slug_pattern: "^[a-z0-9-]+$"
  story_id_pattern: "^STORY-\\d{1,}-[a-z0-9-]+$"
  task_id_pattern: "^TASK-\\d{1,}-[a-z0-9-]+$"
  require_acceptance_criteria: true
  min_acceptance_criteria: 1
  max_title_length: 200
  max_summary_length: 500

# Required directories (validated on initialization)
required_directories:
  - "work-items/backlog"
  - "work-items/todo"
  - "work-items/in-progress"
  - "work-items/awaiting-approval"
  - "work-items/done"
  - "reference/technical"
  - "reference/human-facing"
  - "reference/media"
  - "agents/logs"
  - "agents/memory"
  - "templates"

# File templates
templates:
  story_template: "templates/story-template.md"
  task_template: "templates/task-template.md"
  artifact_template: "templates/artifact-template.md"

# Logging configuration
logging:
  format: "json-lines"
  rotation: "daily"
  log_directory: "agents/logs"
  required_fields: ["timestamp", "role", "activity", "outcome"]
  activity_types:
    - "story_created"
    - "story_updated"
    - "task_created"
    - "task_updated"
    - "work_started"
    - "work_completed"
    - "artifact_created"
    - "comment_created"
    - "state_transition"
    - "prioritization_changed"
    - "human_interaction"
    - "role_delegated"
    - "validation_performed"
    - "error_occurred"

# Features (can be toggled)
features:
  enable_epic_support: false  # Future feature
  enable_sprint_planning: false  # Future feature
  enable_time_tracking: false  # Future feature
  strict_validation: true
  enforce_acceptance_criteria: true
  log_all_activities: true

# Metadata about this config file
config_metadata:
  schema_version: "1.0"
  last_updated: "2026-03-30T20:33:00Z"
  updated_by: "workspace-initializer"